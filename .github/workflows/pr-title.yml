name: PR Title

# 本仓库用合并提交，release-please 从 PR 里的每个提交生成 CHANGELOG；改用 squash 时用的是 PR 标题。
# 两者都检查。edited 让改标题后重新检查。不按目标分支过滤，理由同 ci.yml。
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | node scripts/check-commit-message.cjs -

      - name: Check commit titles
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-commit-message.cjs --range "$BASE_SHA..$HEAD_SHA"
