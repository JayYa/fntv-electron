name: Build

# 打包一个平台的安装包，上传为 <platform>-build artifact。release.yml 发版和
# build-and-smoke.yml 冒烟测试都调用这里，构建流程只有这一份。
on:
  workflow_call:
    inputs:
      os:
        description: Runner image, e.g. ubuntu-latest
        required: true
        type: string
      platform:
        description: windows, macos or linux
        required: true
        type: string
      ref:
        description: Commit or branch to build; empty means the triggering commit
        required: false
        default: ''
        type: string
      upload:
        description: Upload the installers as <platform>-build; cache-warm.yml only fills caches and passes false
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45
    env:
      # 构建依赖的 MPV 归档，固定 tag 和 sha256。缓存 key 也用这里的 sha256。
      MPV_CONFIG_REPO: JayYa/fntv-mpv-config
      MPV_CONFIG_TAG: fntv-mpv-v20261108_233327
      MPV_CONFIG_ASSET: mpv-package-20261108_153320.zip
      MPV_CONFIG_SHA256: 783cc16db5c70e88cd30f8c16f20843799a6983ef20eae2c562f549b7a67b1fc

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 发版时构建 release-please 打 tag 的那个提交（release.yml）。
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: pnpm

      - name: Remove local registry config
        run: |
          rm -f .npmrc
        shell: bash
        continue-on-error: true

      # 和 ci.yml 共用：安装时跳过 Electron 下载，再带缓存和重试单独下载。
      - name: Install dependencies
        id: install
        uses: ./.github/actions/install-dependencies
        timeout-minutes: 15

      # 不装 Python：生产依赖（axios、node-mpv-2、semver）没有原生模块，electron-builder 的
      # @electron/rebuild 在三个平台上都不编译（日志 "installing native dependencies" 不到 1 秒完成），
      # 用不到 node-gyp；打 dmg 用的 dmgbuild 是 electron-builder 下载的独立可执行文件，自带 Python。
      # ci.yml 三个平台也不装 Python，pnpm install 照常通过。

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/modules/proxy/go.mod
          cache-dependency-path: src/modules/proxy/go.sum

      - name: Setup build environment (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        continue-on-error: true

      # 压缩包按 sha256 缓存，换版本时 key 跟着变。Release 下载偶尔返回 5xx，命中缓存就不用下载。
      # restore 和 save 分开：下载校验通过就保存，后面的构建失败也不丢缓存。
      - name: Restore MPV archive cache
        id: mpv-archive-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/mpv-archive
          key: mpv-archive-${{ runner.os }}-${{ env.MPV_CONFIG_SHA256 }}

      - name: Download third-party dependencies
        shell: bash
        timeout-minutes: 10
        run: |
          ARCHIVE="$RUNNER_TEMP/mpv-archive/mpv-config.zip"
          mkdir -p "$(dirname "$ARCHIVE")"
          SHA256_TOOL=$(command -v sha256sum || echo "shasum -a 256")
          verify() { (cd "$(dirname "$ARCHIVE")" && echo "$MPV_CONFIG_SHA256  mpv-config.zip" | $SHA256_TOOL -c -); }

          # 缓存命中也要校验，不通过就重新下载。
          if [ -f "$ARCHIVE" ] && verify; then
            echo "Using cached archive"
          else
            rm -f "$ARCHIVE"
            DOWNLOAD_URL="https://github.com/$MPV_CONFIG_REPO/releases/download/$MPV_CONFIG_TAG/$MPV_CONFIG_ASSET"
            echo "Downloading from: $DOWNLOAD_URL"
            # 5 次重试各隔 10 秒，所有错误都重试，总时长不超过 5 分钟。
            curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --retry-max-time 300 --connect-timeout 30 -o "$ARCHIVE" "$DOWNLOAD_URL"
            verify
          fi

          mkdir -p third_party/fntv-mpv
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -Command "Expand-Archive -Path '$(cygpath -w "$ARCHIVE")' -DestinationPath third_party/fntv-mpv -Force"
          else
            unzip -q "$ARCHIVE" -d third_party/fntv-mpv
          fi

          echo "Final structure:"
          find third_party/fntv-mpv -maxdepth 2 -type d

      - name: Save MPV archive cache
        if: steps.mpv-archive-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/mpv-archive
          key: ${{ steps.mpv-archive-cache.outputs.cache-primary-key }}

      # electron-builder 打包时下载 Electron zip 和打包工具（AppImage、NSIS 等），GitHub 偶尔返回 504。
      # key 只含 electron、electron-builder 和 app-builder-lib 的版本（scripts/ci-download-cache.cjs）：用锁文件 hash 时
      # 每个依赖 PR 都改锁文件，几乎从不命中。版本变了时按 restore-keys 先找同一 Electron 版本、再找同一平台的旧缓存，
      # 打包工具大多还能用，缺的再下载。PR 能读到 main 上的缓存，main 上的缓存由 cache-warm.yml 填充。
      # 打包工具存到 ELECTRON_BUILDER_CACHE，由 Build application 显式指定。Electron zip 由 @electron/get
      # 存到它的默认目录（不读 ELECTRON_CACHE，路径是 <默认目录>/<子目录>/<zip>）。宿主架构的 zip（Linux x64、
      # macOS arm64、Windows x64）已由 install-dependencies 的 electron-<os> 缓存恢复，这里只存另一个架构的
      # zip（Linux arm64、macOS x64），不写排除规则：actions/cache 匹配到目录时整个打包，排除不了目录里的文件。
      # 匹配不到的路径会被忽略。runner 换架构时要跟着改，否则那个 zip 每次重新下载。
      - name: Restore packaging download cache
        id: packaging-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            ${{ runner.temp }}/electron-builder-cache
            ~/.cache/electron/**/electron-v*-linux-arm64.zip
            ~/Library/Caches/electron/**/electron-v*-darwin-x64.zip
          key: ${{ steps.install.outputs.packaging-key }}
          restore-keys: |
            ${{ steps.install.outputs.packaging-electron-prefix }}
            ${{ steps.install.outputs.packaging-prefix }}

      # 删掉从旧版本缓存恢复的 Electron zip；写入 SHASUMS256.txt-<版本>，命中缓存的 zip 校验时不再联网下载 SHASUMS256.txt。
      - name: Prepare packaging download cache
        run: node scripts/ci-download-cache.cjs prepare-packaging

      - name: Compile TypeScript
        run: pnpm run compile
        timeout-minutes: 5

      # electron-builder 自己对每个下载只重试 3 次，间隔 2 到 6 秒，次数和间隔都不能配置。
      # 日志里有 5xx 或网络错误时整个打包命令再跑，共 3 次，间隔 30、60 秒；其它错误直接失败。
      # 前一次已下载的文件留在缓存目录里，重跑时不再下载。
      - name: Build application
        env:
          PLATFORM: ${{ inputs.platform }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
          RETRY_DELAY: '30'
        run: |
          case "$PLATFORM" in
            windows) script=build:win ;;
            macos) script=build:mac ;;
            *) script=build:linux ;;
          esac
          log="$RUNNER_TEMP/build-application.log"
          for attempt in 1 2 3; do
            if pnpm run "$script" 2>&1 | tee "$log"; then exit 0; fi
            if ! grep -Eq 'Response code 5[0-9]{2}|HttpError: 5[0-9]{2}|ECONNRESET|ETIMEDOUT|ENOTFOUND|EAI_AGAIN|socket hang up' "$log"; then
              exit 1
            fi
            if [ "$attempt" = 3 ]; then echo "Build failed with a download error after $attempt attempts"; exit 1; fi
            echo "Build failed with a download error (attempt $attempt), retrying in $((attempt * RETRY_DELAY))s"
            sleep $((attempt * RETRY_DELAY))
          done
        shell: bash
        timeout-minutes: 30

      - name: Save packaging download cache
        if: steps.packaging-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            ${{ runner.temp }}/electron-builder-cache
            ~/.cache/electron/**/electron-v*-linux-arm64.zip
            ~/Library/Caches/electron/**/electron-v*-darwin-x64.zip
          key: ${{ steps.packaging-cache.outputs.cache-primary-key }}

      - name: Upload build artifacts
        if: inputs.upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.platform }}-build
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30
      # —— 构建后：兜底清理（避免影响后续/下次流水线）——
      - name: Post-clean DMG volumes (FNMedia_* / 飞牛影视*)
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
            set -euo pipefail
            matches="$(
            hdiutil info | awk -F': ' '/mount-point/ {print $2}' | \
            grep -E '^(\/Volumes\/FNMedia_|\/Volumes\/飞牛影视)' || true
            )"
            if [ -n "$matches" ]; then
            echo "$matches" | while IFS= read -r V; do
                [ -z "$V" ] && continue
                echo "==> Force detaching leftover: $V"
                lsof +D "$V" || true
                hdiutil detach -force "$V" || true
                diskutil unmount force "$V" || true
            done
            else
            echo "No leftover volumes."
            fi
