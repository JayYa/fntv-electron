name: TMP loop 334

on:
  push:
    branches:
      - t3/triage-issue-334
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loop:
    name: Loop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          cache: pnpm
      - run: rm -f .npmrc
      - uses: ./.github/actions/install-dependencies
      - run: pnpm run compile
      - name: Loop the pending-updates tray test
        shell: bash
        run: |
          failed=0
          for i in $(seq 1 60); do
            if ! node --test --test-timeout=30000 --test-name-pattern='pending-updates item disappears' tests/trayMpvMenu.test.cjs > "run-$i.log" 2>&1; then
              failed=$((failed + 1))
              echo "run $i failed"
              tail -30 "run-$i.log"
            fi
          done
          echo "failed $failed of 60"
          [ "$failed" -eq 0 ]
