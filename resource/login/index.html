<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 修改 favicon 为 base64 图标 -->
    <link rel="icon" href="./image/logo.png" type="image/png" />
    <title>飞牛影视</title>
    <link rel="stylesheet" href="./index.css" />
</head>

<body>
    <div class="login-container">
        <div class="logo">
            <!-- 修改 logo 图标为 base64 -->
            <img src="./image/logo.png" alt="飞牛影视" />
            <div class="logo-info">
                <span class="code-by">原作者</span>
                <a href="https://github.com/QiaoKes/fntv-electron" class="github-link" target="_blank" rel="noopener noreferrer">Tag mig hånden</a>
                <span class="code-by">维护者</span>
                <a href="https://github.com/JayYa/fntv-electron" class="github-link" target="_blank" rel="noopener noreferrer">JayYa</a>
            </div>
        </div>
        <div class="form-group has-button">
            <label for="domain">域名/IP地址/FN ID</label>
            <input type="text" id="domain" placeholder="请输入服务器域名、IP地址或 FN ID" spellcheck="false" tabindex="1" />
            <button type="button" class="history-btn" id="historyBtn" title="选择历史记录"><img width="20px" src="./image/history.png" alt="历史记录" /></button>
            <div class="history-dropdown" id="historyDropdown">
                <div class="no-history">暂无历史记录</div>
            </div>
            <div id="domainError" class="error-msg" style="display:none;">请正确填写IPV4、IPV6、域名或 FN ID（6-30 位字母、数字、连字符或下划线）</div>
        </div>
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" placeholder="请输入用户名" spellcheck="false" tabindex="2" />
        </div>
        <div class="form-group has-button">
            <label for="password">密码</label>
            <input type="password" id="password" placeholder="请输入密码" spellcheck="false" tabindex="3" />
            <button type="button" class="password-toggle" id="passwordToggle" title="显示/隐藏密码"><img id="passwordToggleImg" width="20px" src="./image/password-show.png" alt="显示密码" /></button>
        </div>
        <div class="form-group has-button">
            <label for="accessCode">访问码（可选）</label>
            <input type="password" id="accessCode" placeholder="服务器未启用访问码时请留空" spellcheck="false" autocomplete="off" tabindex="4" />
            <button type="button" class="password-toggle" id="accessCodeToggle" title="显示访问码"><img id="accessCodeToggleImg" width="20px" src="./image/password-show.png" alt="显示访问码" /></button>
        </div>
        <div class="switch-container">
            <label class="switch">
                <input type="checkbox" id="httpsSwitch" />
                <span class="slider"></span>
            </label>
            <span class="switch-label">HTTPS安全访问</span>
        </div>
        <button class="login-btn" id="loginBtn" disabled>登录</button>
        
        <!-- 版本信息和更新检查 -->
        <div class="version-info">
            <div class="version-text" id="versionText">版本 1.6.4</div>
            <button class="update-btn" id="updateBtn" title="检查更新">检查更新</button>
        </div>
    </div>

    <!-- 代理设置按钮（右上角） -->
    <div class="proxy-settings-btn" id="proxySettingsBtn" title="通用设置">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M12 15.5A3.5 3.5 0 0 1 8.5 12A3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65Z" stroke="currentColor" stroke-width="1.5" fill="none"/>
        </svg>
    </div>

    <!-- 代理设置面板 -->
    <div class="proxy-panel" id="proxyPanel">
        <div class="proxy-panel-header">
            <span>通用设置</span>
            <button class="proxy-close-btn" id="proxyCloseBtn">×</button>
        </div>
        <div class="proxy-panel-content">
            <div class="proxy-switch-row">
                <span>启用下载代理</span>
                <label class="proxy-switch">
                    <input type="checkbox" id="proxyEnabledSwitch">
                    <span class="proxy-slider"></span>
                </label>
            </div>
            <div class="proxy-url-row">
                <label for="proxyUrlInput">下载代理地址:</label>
                <input type="text" id="proxyUrlInput" placeholder="https://ghfast.top" />
            </div>
            <div class="proxy-switch-row">
                <span>使用 MPV 播放</span>
                <label class="proxy-switch">
                    <input type="checkbox" id="hideOriginalPlayButtonSwitch" checked>
                    <span class="proxy-slider"></span>
                </label>
            </div>
            <div class="proxy-panel-footer">
                <button class="proxy-save-btn" id="proxySaveBtn">保存</button>
            </div>
        </div>
    </div>

    <!-- 自定义确认对话框 -->
    <div class="custom-confirm" id="customConfirm">
        <div class="confirm-dialog">
            <div class="confirm-title">确认操作</div>
            <div class="confirm-message" id="confirmMessage">确定要执行此操作吗？</div>
            <div class="confirm-buttons">
                <button class="confirm-btn cancel" id="confirmCancel">取消</button>
                <button class="confirm-btn confirm" id="confirmOk">确定</button>
            </div>
        </div>
    </div>

    <!-- 自定义消息弹窗 -->
    <div class="custom-message" id="customMessage">
        <div class="message-dialog">
            <div class="message-icon" id="messageIcon">ℹ️</div>
            <div class="message-title" id="messageTitle">提示</div>
            <div class="message-content" id="messageContent">这里是消息内容</div>
            <button class="message-button" id="messageButton">确定</button>
        </div>
    </div>

    <script src="./dom.js"></script>
    <script src="./dialogs.js"></script>
    <script src="./form.js"></script>
    <script src="./history.js"></script>
    <script src="./pageEvents.js"></script>
    <script src="./settings.js"></script>
    <script src="./index.js"></script>
</body>

</html>
