name: Release

# push 到 main：release-please 维护 Release PR，这里不对 Release PR 构建。Release PR 会触发
# pull_request workflow，但要维护者在 PR 上批准后才运行；它总会改 package.json，批准后
# smoke-test.yml 跑 5 个目标的冒烟测试，结果显示在 PR 上。
# 合并 Release PR 后先建 draft Release，
# 三平台构建、5 个安装包的冒烟测试全部成功、资产上传齐全后才转为正式。更新检查只看
# 最新的正式 Release，有一个安装包启动不了或资产不全时都不能公开，Release 停在 draft。
# GITHUB_TOKEN 创建的 Release 不会触发其它 workflow，所以构建、冒烟测试和发布都放在
# 这一个 workflow 里，用 needs 串起来。门禁关系由 tests/releaseGate.test.cjs 锁住。
# workflow_dispatch：只构建并跑冒烟测试，产物留在 Actions artifacts，不发布。
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        required: true
        default: all
        type: choice
        options:
          - all
          - unix
          - windows
          - macos
          - linux

permissions:
  contents: read

# 同一分支只保留一个排队中的运行，再来一次 push 时前一个排队的运行会被取消。
# 被取消的即使是合并 Release PR 那次，release-please 在下次 push 时也会补建 Release，能自愈。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # 配置在 release-please-config.json：draft + force-tag-creation，tag 形如 v2.7.0。
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  select-matrix:
    needs: release-please
    # 手动触发时 release-please 被跳过，!cancelled() 让这里照常运行。
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}
    steps:
      # 构建机器和每个平台要测的架构在 build-and-smoke.yml 的 select-targets 里。
      # 发版是 push 触发，没有 platform 输入，按 all 走：三个平台、5 个安装包都要测。
      - name: Select platforms
        id: matrix
        env:
          PLATFORM: ${{ github.event.inputs.platform || 'all' }}
        run: |
          case "$PLATFORM" in
            windows|macos|linux)
              echo "platforms=[\"$PLATFORM\"]" >> "$GITHUB_OUTPUT"
              ;;
            unix)
              echo 'platforms=["macos","linux"]' >> "$GITHUB_OUTPUT"
              ;;
            all)
              echo 'platforms=["windows","macos","linux"]' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported platform selection: $PLATFORM" >&2
              exit 1
              ;;
          esac

  # 每个平台构建一次（build.yml，上传 <platform>-build），再对其中每个安装包跑冒烟测试。
  # publish 上传的就是这份 artifact，冒烟测试测的和发布的是同一批文件，不另外构建。
  build-and-smoke:
    name: ${{ matrix.platform }}
    needs: [release-please, select-matrix]
    if: ${{ !cancelled() && needs.select-matrix.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.select-matrix.outputs.platforms) }}
    uses: ./.github/workflows/build-and-smoke.yml
    with:
      platform: ${{ matrix.platform }}
      # 发版时构建 release-please 打 tag 的那个提交（sha 只在建了 Release 时有值），手动触发时构建当前提交。
      ref: ${{ needs.release-please.outputs.sha || github.sha }}

  # 发版门禁：任何一个平台的构建或任何一个安装包的冒烟测试失败，矩阵 job 的结果就不是
  # success，publish 跳过，Release 停在 draft。不要给这里加 always() 或 !cancelled()。
  publish:
    name: Publish release
    needs: [release-please, build-and-smoke]
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.build-and-smoke.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-build'
          path: dist
          merge-multiple: true

      # 更新检查按这些名字匹配安装包（src/modules/updater/updateChecker.ts），缺一个就不发布。
      # 每个冒烟目标一个（tests/smoke/targets.cjs 的 installerPattern，tests/releaseGate.test.cjs 核对）。
      # 应用内更新读 Windows、Linux x64 和 Linux arm64 的更新元数据，同样缺一个就不发布。它们和安装包
      # 来自同一份 artifact，sha512 对得上。macOS 的 latest-mac.yml 不核对（docs/adr/0003-release-gate.md）。
      - name: Check release assets
        shell: bash
        run: |
          missing=0
          for name in \
            "FNMedia_${VERSION}_win_x64.exe" \
            "FNMedia_${VERSION}_mac_x64.dmg" \
            "FNMedia_${VERSION}_mac_arm64.dmg" \
            "FNMedia_${VERSION}_linux_x86_64.AppImage" \
            "FNMedia_${VERSION}_linux_arm64.AppImage" \
            latest.yml \
            latest-linux.yml \
            latest-linux-arm64.yml; do
            if [ ! -f "dist/$name" ]; then
              echo "::error::missing $name"
              missing=1
            fi
          done
          ls -l dist
          exit "$missing"

      - name: Upload release assets
        shell: bash
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish draft release
        shell: bash
        run: gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
