name: Build

# 打包一个平台的安装包，上传为 <platform>-build artifact。release.yml 发版和
# build-and-smoke.yml 冒烟测试都调用这里，构建流程只有这一份。
on:
  workflow_call:
    inputs:
      os:
        description: Runner image, e.g. ubuntu-latest
        required: true
        type: string
      platform:
        description: windows, macos or linux
        required: true
        type: string
      ref:
        description: Commit or branch to build; empty means the triggering commit
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    env:
      # 构建依赖的 MPV 归档，固定 tag 和 sha256。缓存 key 也用这里的 sha256。
      MPV_CONFIG_REPO: JayYa/fntv-mpv-config
      MPV_CONFIG_TAG: fntv-mpv-v20260826_013404
      MPV_CONFIG_ASSET: mpv-package-20260825_173358.zip
      MPV_CONFIG_SHA256: 1d9f5fe6411e08710e2cdc5f76286ff2667bfa53acee6f0cfa8572ed5bb05c5b

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 发版时构建 release-please 打 tag 的那个提交（release.yml）。
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Remove local registry config
        run: |
          rm -f .npmrc
        shell: bash
        continue-on-error: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      - name: Setup Python (for native modules)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/modules/proxy/go.mod
          cache-dependency-path: src/modules/proxy/go.sum

      - name: Setup build environment (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        continue-on-error: true

      # 压缩包按 sha256 缓存，换版本时 key 跟着变。Release 下载偶尔返回 5xx，命中缓存就不用下载。
      # restore 和 save 分开：下载校验通过就保存，后面的构建失败也不丢缓存。
      - name: Restore MPV archive cache
        id: mpv-archive-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/mpv-archive
          key: mpv-archive-${{ runner.os }}-${{ env.MPV_CONFIG_SHA256 }}

      - name: Download third-party dependencies
        shell: bash
        timeout-minutes: 10
        run: |
          ARCHIVE="$RUNNER_TEMP/mpv-archive/mpv-config.zip"
          mkdir -p "$(dirname "$ARCHIVE")"
          SHA256_TOOL=$(command -v sha256sum || echo "shasum -a 256")
          verify() { (cd "$(dirname "$ARCHIVE")" && echo "$MPV_CONFIG_SHA256  mpv-config.zip" | $SHA256_TOOL -c -); }

          # 缓存命中也要校验，不通过就重新下载。
          if [ -f "$ARCHIVE" ] && verify; then
            echo "Using cached archive"
          else
            rm -f "$ARCHIVE"
            DOWNLOAD_URL="https://github.com/$MPV_CONFIG_REPO/releases/download/$MPV_CONFIG_TAG/$MPV_CONFIG_ASSET"
            echo "Downloading from: $DOWNLOAD_URL"
            # 5 次重试各隔 10 秒，所有错误都重试，总时长不超过 5 分钟。
            curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --retry-max-time 300 --connect-timeout 30 -o "$ARCHIVE" "$DOWNLOAD_URL"
            verify
          fi

          mkdir -p third_party/fntv-mpv
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -Command "Expand-Archive -Path '$(cygpath -w "$ARCHIVE")' -DestinationPath third_party/fntv-mpv -Force"
          else
            unzip -q "$ARCHIVE" -d third_party/fntv-mpv
          fi

          echo "Final structure:"
          find third_party/fntv-mpv -maxdepth 2 -type d

      - name: Save MPV archive cache
        if: steps.mpv-archive-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/mpv-archive
          key: ${{ steps.mpv-archive-cache.outputs.cache-primary-key }}

      # electron-builder 打包时下载 Electron zip 和打包工具（AppImage、NSIS 等），GitHub 偶尔返回 504。
      # electron 和 electron-builder 的版本都在锁文件里，key 用锁文件 hash。
      # Electron zip 由 @electron/get 存到它的默认目录（不读 ELECTRON_CACHE），三个平台的默认目录都列上，
      # 不存在的会被忽略；打包工具存到 ELECTRON_BUILDER_CACHE，由 Build application 显式指定。
      - name: Restore packaging download cache
        id: packaging-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            ${{ runner.temp }}/electron-builder-cache
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: packaging-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Compile TypeScript
        run: pnpm run compile
        timeout-minutes: 5

      - name: Build application
        env:
          PLATFORM: ${{ inputs.platform }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
        run: |
          if [ "$PLATFORM" = "windows" ]; then
            pnpm run build:win
          elif [ "$PLATFORM" = "macos" ]; then
            pnpm run build:mac
          else
            pnpm run build:linux
          fi
        shell: bash
        timeout-minutes: 15

      - name: Save packaging download cache
        if: steps.packaging-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            ${{ runner.temp }}/electron-builder-cache
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: ${{ steps.packaging-cache.outputs.cache-primary-key }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.platform }}-build
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30
      # —— 构建后：兜底清理（避免影响后续/下次流水线）——
      - name: Post-clean DMG volumes (FNMedia_* / 飞牛影视*)
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
            set -euo pipefail
            matches="$(
            hdiutil info | awk -F': ' '/mount-point/ {print $2}' | \
            grep -E '^(\/Volumes\/FNMedia_|\/Volumes\/飞牛影视)' || true
            )"
            if [ -n "$matches" ]; then
            echo "$matches" | while IFS= read -r V; do
                [ -z "$V" ] && continue
                echo "==> Force detaching leftover: $V"
                lsof +D "$V" || true
                hdiutil detach -force "$V" || true
                diskutil unmount force "$V" || true
            done
            else
            echo "No leftover volumes."
            fi
