name: CI

# pull_request 不按目标分支过滤：堆叠 PR 的 base 不是 main，也要跑。
# push 到 main 时再跑一遍：几个 PR 各自通过、合在一起才出错的情况只有在 main 上才看得到
#（#207 和 #209 合并后 main 上 7 项测试失败，到 #210 才发现）。
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# 同一个 ref 有新运行时取消还在跑的旧运行，以最后一次的结果为准。github.ref 在 pull_request 上是
# refs/pull/<编号>/merge，每个 PR 一组；在 push 上是 refs/heads/main，连续合并时只看最新一次合并。
# 组名带 ci- 前缀，不和其它 workflow 的组（smoke-test-、release-）相撞。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 维护者只有 Windows 电脑，macOS 和 Linux 的问题靠 CI 暴露。fail-fast 关掉，一个平台失败时其它平台照样跑完。
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # PR 上检出的是合并提交，第一个父提交是 base，fetch-depth: 2 才拿得到它（Run checks 的文件大小检查）。
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # 不写 version：版本来自 package.json 的 packageManager。放在 setup-node 前面，cache: pnpm 要用到 pnpm。
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: pnpm

      # .npmrc 指向国内镜像，只给本地开发用。Windows 默认 shell 是 PowerShell，rm -f 要用 bash。
      - name: Remove local registry config
        run: rm -f .npmrc
        shell: bash

      # 安装时跳过 Electron 下载，再带缓存和重试单独下载，和 build.yml 共用（.github/actions/install-dependencies）。
      # 测试要用 Electron 二进制，不能整个跳过。
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        timeout-minutes: 15

      # 和本地同一条命令（scripts/check.cjs）：文件大小、lint、knip、测试，结尾汇总每步结果。
      # 文件大小检查和 pre-commit 钩子是同一个脚本，拦住用 --no-verify 绕过钩子的提交；只在 Linux 那一格的 PR 上跑，
      # 对比合并提交的第一个父提交（base），读合并后的内容。push 到 main 时不跑，合并进来的改动在 PR 上已经检查过。
      - name: Run checks
        shell: bash
        env:
          FILE_SIZE: ${{ matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request' }}
        run: |
          if [ "$FILE_SIZE" = true ]; then
            pnpm run check --base HEAD^1
          else
            pnpm run check --no-file-size
          fi

      # 未打包启动检查：pnpm run check 已编译到 dest/，用 node_modules 里的 Electron 启动仓库，跑安装包冒烟测试的
      # 同一套断言（scripts/smoke-unpackaged.cjs）。smoke-test.yml 的路径过滤不含 src/**，只改源码的 PR 靠这一步
      # 发现启动不了。Linux 没有显示器，用 xvfb；没有中文字体时截图里的中文是方框。Windows、macOS 的 runner 有图形会话。
      - name: Install Linux display and CJK fonts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb fonts-noto-cjk

      - name: Launch unpackaged app
        shell: bash
        timeout-minutes: 4
        env:
          FNTV_SMOKE_ARTIFACTS: smoke-artifacts/unpackaged
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a --server-args="-screen 0 1920x1080x24" node scripts/smoke-unpackaged.cjs
          else
            node scripts/smoke-unpackaged.cjs
          fi

      # 截图、主进程输出（main-process.log）、app.log（logs/）和 proxy.log，只在失败时上传。
      - name: Upload unpackaged launch artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unpackaged-${{ runner.os }}
          path: smoke-artifacts/unpackaged
          if-no-files-found: warn
          retention-days: 14

  # 分支保护只要求这一个 job，以后调整矩阵、增减 job 不用改 ruleset。needs 列出所有必需的 job，
  # 任何一个失败或取消就失败。always() 让它在前面失败时也运行，否则会被跳过，跳过在分支保护里算通过。
  check:
    name: Check
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all jobs to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              failure|cancelled) echo "::error::A required job did not succeed: $RESULTS"; exit 1 ;;
            esac
          done
