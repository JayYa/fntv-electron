# pnpm 配置写在这里，.npmrc 只放 registry：pnpm 不读 .npmrc 里的 node-linker，也不把 electron_mirror 传给安装脚本。
nodeLinker: hoisted

# 放行这些包的安装脚本。未列出的包有安装脚本时，pnpm install 直接报错。
# electron 从 42 起没有安装脚本，二进制在第一次 require('electron') 或运行 install.js 时下载，不用放行。
allowBuilds:
  electron-winstaller: true
  esbuild: true
  sharp: true

patchedDependencies:
  node-mpv-2@2.0.0-beta.3: patches/node-mpv-2@2.0.0-beta.3.patch
