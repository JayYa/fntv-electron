name: TMP loop 334

on:
  push:
    branches:
      - t3/triage-issue-334
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loop:
    name: Loop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          cache: pnpm
      - run: rm -f .npmrc
      - uses: ./.github/actions/install-dependencies
      - run: pnpm run compile
      - name: Loop the full test suite
        shell: bash
        run: |
          hit=0
          for i in $(seq 1 24); do
            node --test --test-reporter=tap --test-timeout=30000 tests/*.test.cjs > "run-$i.log" 2>&1 || true
            if grep -q "^not ok .*pending-updates item disappears" "run-$i.log"; then
              hit=$((hit + 1)); echo "run $i: pending-updates test failed"
            fi
            grep "^not ok" "run-$i.log" | sed "s/^/run $i: /" || true
          done
          echo "pending-updates failed $hit of 24"
          [ "$hit" -eq 0 ]
