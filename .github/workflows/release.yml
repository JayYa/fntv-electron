name: Release

# push 到 main：release-please 维护 Release PR；合并 Release PR 后先建 draft Release，
# 三平台构建全部成功、资产上传齐全后才转为正式。更新检查只看最新的正式 Release，
# 资产不全时不能公开。GITHUB_TOKEN 创建的 Release 不会触发其它 workflow，所以构建和
# 发布都放在这一个 workflow 里，用 needs 串起来。
# workflow_dispatch：只构建，产物留在 Actions artifacts，不发布。
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        required: true
        default: all
        type: choice
        options:
          - all
          - unix
          - windows
          - macos
          - linux

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # 配置在 release-please-config.json：draft + force-tag-creation，tag 形如 v2.7.0。
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  select-matrix:
    needs: release-please
    # 手动触发时 release-please 被跳过，!cancelled() 让这里照常运行。
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      build-matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Select build matrix
        id: matrix
        env:
          PLATFORM: ${{ github.event.inputs.platform || 'all' }}
        run: |
          case "$PLATFORM" in
            windows)
              echo 'value={"include":[{"os":"windows-latest","platform":"windows"}]}' >> "$GITHUB_OUTPUT"
              ;;
            macos)
              echo 'value={"include":[{"os":"macos-latest","platform":"macos"}]}' >> "$GITHUB_OUTPUT"
              ;;
            linux)
              echo 'value={"include":[{"os":"ubuntu-latest","platform":"linux"}]}' >> "$GITHUB_OUTPUT"
              ;;
            unix)
              echo 'value={"include":[{"os":"macos-latest","platform":"macos"},{"os":"ubuntu-latest","platform":"linux"}]}' >> "$GITHUB_OUTPUT"
              ;;
            all)
              echo 'value={"include":[{"os":"windows-latest","platform":"windows"},{"os":"macos-latest","platform":"macos"},{"os":"ubuntu-latest","platform":"linux"}]}' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported platform selection: $PLATFORM" >&2
              exit 1
              ;;
          esac

  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [release-please, select-matrix]
    if: ${{ !cancelled() && needs.select-matrix.result == 'success' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-matrix.outputs.build-matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 发版时构建 release-please 打 tag 的那个提交，package.json 里已是新版本号。
          ref: ${{ needs.release-please.outputs.sha || github.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Remove local registry config
        run: |
          rm -f .npmrc
        shell: bash
        continue-on-error: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      - name: Setup Python (for native modules)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/modules/proxy/go.mod
          cache-dependency-path: src/modules/proxy/go.sum

      - name: Setup build environment (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        continue-on-error: true

      - name: Download third-party dependencies
        shell: bash
        env:
          MPV_CONFIG_REPO: JayYa/fntv-mpv-config
          MPV_CONFIG_TAG: fntv-mpv-v20260826_013404
          MPV_CONFIG_ASSET: mpv-package-20260825_173358.zip
          MPV_CONFIG_SHA256: 1d9f5fe6411e08710e2cdc5f76286ff2667bfa53acee6f0cfa8572ed5bb05c5b
        run: |
          DOWNLOAD_URL="https://github.com/$MPV_CONFIG_REPO/releases/download/$MPV_CONFIG_TAG/$MPV_CONFIG_ASSET"
          echo "Downloading from: $DOWNLOAD_URL"
          curl -fsSL --retry 3 -o mpv-config.zip "$DOWNLOAD_URL"

          SHA256_TOOL=$(command -v sha256sum || echo "shasum -a 256")
          echo "$MPV_CONFIG_SHA256  mpv-config.zip" | $SHA256_TOOL -c -

          mkdir -p third_party/fntv-mpv
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -Command "Expand-Archive -Path mpv-config.zip -DestinationPath third_party/fntv-mpv -Force"
          else
            unzip -q mpv-config.zip -d third_party/fntv-mpv
          fi
          rm -f mpv-config.zip

          echo "Final structure:"
          find third_party/fntv-mpv -maxdepth 2 -type d

      - name: Compile TypeScript
        run: pnpm run compile
        timeout-minutes: 5

      - name: Build application
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            pnpm run build:win
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            pnpm run build:mac
          else
            pnpm run build:linux
          fi
        shell: bash
        timeout-minutes: 15
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}-build
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30
      # —— 构建后：兜底清理（避免影响后续/下次流水线）——
      - name: Post-clean DMG volumes (FNMedia_* / 飞牛影视*)
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
            set -euo pipefail
            matches="$(
            hdiutil info | awk -F': ' '/mount-point/ {print $2}' | \
            grep -E '^(\/Volumes\/FNMedia_|\/Volumes\/飞牛影视)' || true
            )"
            if [ -n "$matches" ]; then
            echo "$matches" | while IFS= read -r V; do
                [ -z "$V" ] && continue
                echo "==> Force detaching leftover: $V"
                lsof +D "$V" || true
                hdiutil detach -force "$V" || true
                diskutil unmount force "$V" || true
            done
            else
            echo "No leftover volumes."
            fi

  publish:
    name: Publish release
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-build'
          path: dist
          merge-multiple: true

      # 更新检查按这些名字匹配安装包（src/modules/updater/updateChecker.ts），缺一个就不发布。
      - name: Check installers
        shell: bash
        run: |
          missing=0
          for name in \
            "FNMedia_${VERSION}_win_x64.exe" \
            "FNMedia_${VERSION}_mac_x64.dmg" \
            "FNMedia_${VERSION}_mac_arm64.dmg" \
            "FNMedia_${VERSION}_linux_x86_64.AppImage" \
            "FNMedia_${VERSION}_linux_arm64.AppImage"; do
            if [ ! -f "dist/$name" ]; then
              echo "::error::missing $name"
              missing=1
            fi
          done
          ls -l dist
          exit "$missing"

      - name: Upload release assets
        shell: bash
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish draft release
        shell: bash
        run: gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
