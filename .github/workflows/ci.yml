name: CI

# 不按目标分支过滤：堆叠 PR 的 base 不是 main，也要跑。
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # 维护者只有 Windows 电脑，macOS 和 Linux 的问题靠 CI 暴露。fail-fast 关掉，一个平台失败时其它平台照样跑完。
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 不写 version：版本来自 package.json 的 packageManager。放在 setup-node 前面，cache: pnpm 要用到 pnpm。
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/modules/proxy/go.mod
          cache-dependency-path: src/modules/proxy/go.sum

      # .npmrc 指向国内镜像，只给本地开发用。Windows 默认 shell 是 PowerShell，rm -f 要用 bash。
      - name: Remove local registry config
        run: rm -f .npmrc
        shell: bash

      # 安装时跳过 Electron 下载，再带缓存和重试单独下载，和 build.yml 共用（.github/actions/install-dependencies）。
      # 测试要用 Electron 二进制，不能整个跳过。
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        timeout-minutes: 15

      - name: Run lint
        run: pnpm run lint

      # 没用到的依赖、用到却没写进 package.json 的包和命令（配置在 knip.jsonc）。
      - name: Check unused dependencies
        run: pnpm run knip

      # go.mod、go.sum 和代码的导入不一致时打印差异并失败，本地用 go mod tidy 修。
      - name: Check Go modules are tidy
        run: go mod tidy -diff
        working-directory: src/modules/proxy

      - name: Run Node tests
        run: pnpm test

      - name: Run Go tests
        run: go test ./...
        working-directory: src/modules/proxy
