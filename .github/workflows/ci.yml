name: CI

# 不按目标分支过滤：堆叠 PR 的 base 不是 main，也要跑。
on:
  pull_request:

permissions:
  contents: read

# 同一 PR 有新推送时取消还在跑的旧运行，以最后一次推送的结果为准。github.ref 在 pull_request 上是
# refs/pull/<编号>/merge，每个 PR 一组；组名带 ci- 前缀，不和其它 workflow 的组（smoke-test-、cache-warm-）相撞。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 和 pre-commit 钩子同一个脚本，拦住用 --no-verify 绕过钩子的提交。只看这个 PR 相对 base 改动的文件，
  # 读 PR head 的内容；fetch-depth: 0 才拿得到 base 提交和合并基点。脚本只用 git 和 Node 自带模块，不装依赖。
  file-size:
    name: Check file size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false

      - name: Check changed file size
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-staged-file-size.cjs --base "$BASE_SHA"

  test:
    # 维护者只有 Windows 电脑，macOS 和 Linux 的问题靠 CI 暴露。fail-fast 关掉，一个平台失败时其它平台照样跑完。
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 不写 version：版本来自 package.json 的 packageManager。放在 setup-node 前面，cache: pnpm 要用到 pnpm。
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: pnpm

      # .npmrc 指向国内镜像，只给本地开发用。Windows 默认 shell 是 PowerShell，rm -f 要用 bash。
      - name: Remove local registry config
        run: rm -f .npmrc
        shell: bash

      # 安装时跳过 Electron 下载，再带缓存和重试单独下载，和 build.yml 共用（.github/actions/install-dependencies）。
      # 测试要用 Electron 二进制，不能整个跳过。
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        timeout-minutes: 15

      - name: Run lint
        run: pnpm run lint

      # 没用到的依赖、用到却没写进 package.json 的包和命令（配置在 knip.jsonc）。
      - name: Check unused dependencies
        run: pnpm run knip

      - name: Run Node tests
        run: pnpm test
