name: Install dependencies
description: >-
  安装依赖后由单独的步骤带缓存和重试下载 Electron 二进制（electron 42 起安装依赖时不下载）。
  ci.yml 和 build.yml 共用这一份，调用前先 checkout、装好 pnpm 和 Node.js、删掉 .npmrc。
  composite action 的步骤不支持 timeout-minutes，超时写在调用它的步骤上。

outputs:
  electron-version:
    description: Electron version from package.json
    value: ${{ steps.keys.outputs.electron-version }}

runs:
  using: composite
  steps:
    # 不加 --ignore-scripts：esbuild、sharp 等的安装脚本还要跑。electron 42 起没有 postinstall，
    # 也不再读 ELECTRON_SKIP_BINARY_DOWNLOAD，安装时不下载二进制。
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    # key 只取 package.json 里的 Electron 版本和 runner 架构（scripts/ci-download-cache.cjs）。
    - name: Resolve download cache keys
      id: keys
      run: node scripts/ci-download-cache.cjs keys
      shell: bash

    # electron 45 的 index.js 在二进制不在时，第一次 require('electron') 同步运行 install.js 下载，只试一次、不重试。
    # tests/accessCodeSession.test.cjs 在 Node 里 require('electron')，所以在测试和打包之前由下面的步骤预先下载。
    # Electron zip 由 @electron/get 存到默认目录（env-paths('electron').cache，不读 ELECTRON_CACHE），
    # 三个平台的默认目录都列上，不存在的会被忽略。
    # PR 能读到 main 上的缓存，main 上的缓存由 ci.yml 在 push 到 main 时存。7 天没被读过的缓存被 GitHub 清掉后，
    # 下一次 push 到 main 再存，期间的 PR 重新下载（有重试）。
    # 单步 actions/cache：未命中时由 job 结束后的 post 步骤保存，job 失败时不保存，下次运行再下载。
    # 保存的是 job 结束时目录里的全部内容：在 build.yml 里第一次存时，打包下载的另一个架构的 zip 也会被存进来。
    # 同一个 key 只存第一次，main 上只有发版时才打包，通常 ci.yml 先存好。
    # key 带 runner.arch（scripts/ci-download-cache.cjs），zip 只对一种架构有用，runner 换架构时不会恢复出用不上的 zip。
    - name: Cache Electron download
      id: electron-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      continue-on-error: true
      with:
        path: |
          ~/.cache/electron
          ~/Library/Caches/electron
          ~/AppData/Local/electron/Cache
        key: ${{ steps.keys.outputs.electron-key }}

    - name: Download Electron binary
      env:
        RETRY_DELAY: '15'
        # 日志里打出 @electron/get 的 Cache hit / Cache miss 和下载地址，用来核对缓存是否生效。
        DEBUG: '@electron/get:*'
      run: |
        for attempt in 1 2 3 4 5; do
          if node node_modules/electron/install.js; then break; fi
          if [ "$attempt" = 5 ]; then echo "Electron download failed after $attempt attempts"; exit 1; fi
          echo "Electron download failed (attempt $attempt), retrying in $((attempt * RETRY_DELAY))s"
          sleep $((attempt * RETRY_DELAY))
        done
        # install.js 解压完才写 path.txt；dist/version 和包版本一致时 index.js 才不会再下载。
        test -f node_modules/electron/path.txt
        test -f node_modules/electron/dist/version
      shell: bash
