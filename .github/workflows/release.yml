name: Release

# push 到 main：release-please 维护 Release PR；合并 Release PR 后先建 draft Release，
# 三平台构建全部成功、资产上传齐全后才转为正式。更新检查只看最新的正式 Release，
# 资产不全时不能公开。GITHUB_TOKEN 创建的 Release 不会触发其它 workflow，所以构建和
# 发布都放在这一个 workflow 里，用 needs 串起来。
# workflow_dispatch：只构建，产物留在 Actions artifacts，不发布。
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        required: true
        default: all
        type: choice
        options:
          - all
          - unix
          - windows
          - macos
          - linux

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # 配置在 release-please-config.json：draft + force-tag-creation，tag 形如 v2.7.0。
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  select-matrix:
    needs: release-please
    # 手动触发时 release-please 被跳过，!cancelled() 让这里照常运行。
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      build-matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Select build matrix
        id: matrix
        env:
          PLATFORM: ${{ github.event.inputs.platform || 'all' }}
        run: |
          case "$PLATFORM" in
            windows)
              echo 'value={"include":[{"os":"windows-latest","platform":"windows"}]}' >> "$GITHUB_OUTPUT"
              ;;
            macos)
              echo 'value={"include":[{"os":"macos-latest","platform":"macos"}]}' >> "$GITHUB_OUTPUT"
              ;;
            linux)
              echo 'value={"include":[{"os":"ubuntu-latest","platform":"linux"}]}' >> "$GITHUB_OUTPUT"
              ;;
            unix)
              echo 'value={"include":[{"os":"macos-latest","platform":"macos"},{"os":"ubuntu-latest","platform":"linux"}]}' >> "$GITHUB_OUTPUT"
              ;;
            all)
              echo 'value={"include":[{"os":"windows-latest","platform":"windows"},{"os":"macos-latest","platform":"macos"},{"os":"ubuntu-latest","platform":"linux"}]}' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported platform selection: $PLATFORM" >&2
              exit 1
              ;;
          esac

  build:
    name: Build on ${{ matrix.os }}
    needs: [release-please, select-matrix]
    if: ${{ !cancelled() && needs.select-matrix.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-matrix.outputs.build-matrix) }}
    # 构建步骤在 build.yml，冒烟测试（build-and-smoke.yml）也用它。
    uses: ./.github/workflows/build.yml
    with:
      os: ${{ matrix.os }}
      platform: ${{ matrix.platform }}
      # 发版时构建 release-please 打 tag 的那个提交，package.json 里已是新版本号。
      ref: ${{ needs.release-please.outputs.sha || github.sha }}

  publish:
    name: Publish release
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-build'
          path: dist
          merge-multiple: true

      # 更新检查按这些名字匹配安装包（src/modules/updater/updateChecker.ts），缺一个就不发布。
      - name: Check installers
        shell: bash
        run: |
          missing=0
          for name in \
            "FNMedia_${VERSION}_win_x64.exe" \
            "FNMedia_${VERSION}_mac_x64.dmg" \
            "FNMedia_${VERSION}_mac_arm64.dmg" \
            "FNMedia_${VERSION}_linux_x86_64.AppImage" \
            "FNMedia_${VERSION}_linux_arm64.AppImage"; do
            if [ ! -f "dist/$name" ]; then
              echo "::error::missing $name"
              missing=1
            fi
          done
          ls -l dist
          exit "$missing"

      - name: Upload release assets
        shell: bash
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish draft release
        shell: bash
        run: gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
